name: Build ChunkEX .levipack

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and Setup Android NDK
      run: |
        echo "Downloading Android NDK r26b..."
        wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
        unzip -q android-ndk-r26b-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

    - name: Build with CMake
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_SYSTEM_NAME=Android
        cmake --build . --config Release

    - name: Package .levipack
      run: |
        zip -j ChunkEX.levipack manifest.json build/libchunkex.so

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChunkEX.levipack
        path: ChunkEX.levipack
        
